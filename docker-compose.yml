services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gokych}
      MYSQL_USER: ${MYSQL_USER:-gokych}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set me}
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./web
      args:
        STANDALONE: "1"
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # The Next.js server calls the backend directly server-side; the
      # browser hits it via the `/api` rewrite below. Default in
      # web/lib/api.ts already handles both.
      API_BASE_URL: http://backend:8000
      NODE_ENV: production
      # NOTE: NEXT_PUBLIC_API_BASE_URL intentionally unset — browser fetches
      # use same-origin /api (docker-compose serves frontend:3000 directly;
      # there is no EdgeOne edge here). See web/next.config.ts guard.
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  app_data:
