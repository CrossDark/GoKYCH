name: CI

on:
  push:
    branches: [main, optimize/**, audit-fixes/**]
  pull_request:
    branches: [main]

# Cancel an in-flight run for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go (vet + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: gofmt
        run: |
          if [ "$(gofmt -l . | wc -l)" -ne 0 ]; then
            echo "The following files are not gofmt-clean:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: go test
        run: go test ./... -count=1

      - name: go build
        run: go build ./...

  web:
    name: Web (audit + tsc + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Next 16 requires Node >= 20.9.0
          node-version: "20.18"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # Use --no-audit --no-fund for faster CI logs.
        run: npm ci --no-audit --no-fund

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        # Set the same standalone/browser env the docker-compose path uses so
        # the production guard in next.config.ts passes for this OSS build too.
        run: NEXT_PUBLIC_API_BASE_URL=/api npm run build
