name: Glass
version: "2.0"
author: GoKYCH
description: 透明玻璃主题 — 渐变背景 + 透明隔离层 + 彩色玻璃卡片 + 顶部毛玻璃导航 + 可选雨滴/阳光 Canvas 效果

# ── 主题设置 schema ──────────────────────────────────────────────
# Glass 是第一个有 settings 的主题。schema 在 yaml 里声明, schema
# 的实际值由用户配 — 这一轮(P9 / 当前 round)值存浏览器 localStorage:
#   gokych:glass:effect_mode
#   gokych:glass:particle_density
#   gokych:glass:background_image
# 下一轮 P10 后台配置: 把 settings 加进 Theme struct, 在 admin/themes
# page 增加 Modal, 后端新增 theme_settings 表 (theme_name, key, value)。
# 当前: particles.js 启动时按 schema default → localStorage 覆盖顺序读。
settings:
  - key: card_alpha
    type: range
    label: 卡片透明度
    min: 0
    max: 100
    step: 5
    default: 90
    hint: "玻璃卡片的底色透明度 (0=完全透明, 100=完全不透明)。hover 时自动 +13%。default 90 让主页内容卡片默认清晰可读, admin 想'全玻璃感'拖到 30~40"
  - key: card_frost
    type: range
    label: 悬浮卡片磨砂
    min: 0
    max: 100
    step: 5
    default: 30
    hint: "悬浮卡片的 backdrop-filter blur 强度 (0=无, 100=最强 ≈ 40px)。default 30 ≈ 12px, 只给卡片边缘留玻璃感, 内容不糊; 想强玻璃感拖到 60+ (24px+)"
  - key: isolation_frost
    type: range
    label: 隔离层磨砂
    min: 0
    max: 100
    step: 5
    default: 30
    hint: "背景和卡片之间的玻璃隔离层磨砂 (0=透明, 100=最强 ≈ 40px)。控制 #glass-fx-layer 层的 backdrop-filter, 让背景渐变 / 雨滴 / 阳光透过隔离层产生更明显的玻璃感"
  - key: sidebar_frost
    type: range
    label: 左右侧栏磨砂
    min: 0
    max: 100
    step: 5
    default: 70
    hint: "左右两个侧栏(左抽屉 ☰ / 右抽屉 🏷️)和顶部导航、admin 侧栏的 backdrop-filter blur 强度 (0=无, 100=最强 ≈ 40px)"
  - key: effect_mode
    type: select
    label: 效果模式
    options: [none, rain, sunlight]
    default: none
    hint: "默认 none — 零开销。rain/sunlight 启用 Canvas 粒子"
  - key: particle_density
    type: range
    label: 粒子密度
    min: 0
    max: 100
    step: 10
    default: 60
    hint: "仅在效果模式非 none 时生效"
  - key: background_image
    type: image
    label: 背景图
    default: ""
    hint: "留空使用渐变背景。设置后 body 会显示该图, 渐变作为色彩背板"
